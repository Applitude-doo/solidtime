# Based on the official Traefik example from https://docs.solidtime.io/self-hosting/intro
# Changes vs. upstream example:
#  - image tag pinned (no silent upgrades / migrations on restart)
#  - DB credentials come from .env only and are injected into the app containers (no duplication in laravel.env)
#  - DB password is required (no "secret" fallback)
#  - app containers wait for a healthy database
#  - gotenberg restarts automatically
x-solidtime: &solidtime
  restart: always
  image: "solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:?set SOLIDTIME_IMAGE_TAG in .env}"
  user: "1000:1000"
  networks:
    - internal
  volumes:
    - "app-storage:/var/www/html/storage"
    - "./logs:/var/www/html/storage/logs"
    - "./app-storage:/var/www/html/storage/app"
  env_file:
    - laravel.env
  depends_on:
    database:
      condition: service_healthy

x-db-env: &db-env
  DB_CONNECTION: pgsql
  DB_HOST: database
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
  DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

services:
  app:
    <<: *solidtime
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${REVERSE_PROXY_NETWORK}"
      - "traefik.http.services.solidtime.loadbalancer.server.port=8000"
      # http
      - "traefik.http.routers.solidtime.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.solidtime.entrypoints=web"
      - "traefik.http.routers.solidtime.middlewares=redirect-to-https@file"
      # https
      - "traefik.http.routers.solidtime-https.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.solidtime-https.entrypoints=websecure"
      - "traefik.http.routers.solidtime-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.solidtime-https.tls=true"
    networks:
      - frontend
      - internal
    environment:
      <<: *db-env
      CONTAINER_MODE: http
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8000/health-check/up" ]

  scheduler:
    <<: *solidtime
    environment:
      <<: *db-env
      CONTAINER_MODE: scheduler
    healthcheck:
      test: [ "CMD", "healthcheck" ]

  queue:
    <<: *solidtime
    environment:
      <<: *db-env
      CONTAINER_MODE: worker
      WORKER_COMMAND: "php /var/www/html/artisan queue:work"
    healthcheck:
      test: [ "CMD", "healthcheck" ]

  database:
    restart: always
    image: 'postgres:15'
    # On small servers: let the kernel kill PHP containers (they restart) before the database
    oom_score_adj: -500
    environment:
      PGPASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'database-storage:/var/lib/postgresql/data'
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}" ]
      interval: 10s
      retries: 5
      timeout: 5s

  # PDF exports. Disabled by default (needs ~300-500 MB RAM).
  # Enable with COMPOSE_PROFILES=pdf in .env and GOTENBERG_URL in laravel.env.
  gotenberg:
    profiles: [ "pdf" ]
    restart: always
    image: gotenberg/gotenberg:8
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:3000/health" ]

networks:
  frontend:
    name: ${REVERSE_PROXY_NETWORK}
    external: true
  internal:

volumes:
  database-storage:
  app-storage:
